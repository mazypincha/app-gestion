<h2>Módulo de Productos</h2>
<table class="product-table">
    <thead>
    <tr>
        <th>Producto</th> <th>Descripción</th> <th>Precio</th> <th>Descuento</th> <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let prod of lista">
        <td>{{ prod.titulo }}</td>
        <td>{{ prod.descripcion }}</td>
        <td>{{ prod.precio | currency:'ARS':'$ ':'1.2-2' }}</td>
        <td>
        <span [class]="prod.descuento ? 'badge-discount' : 'badge-no-discount'">
            {{ prod.descuento ? prod.descuento + '% OFF' : 'Sin descuento' }}
        </span>
        </td>
        <td>
        <button [routerLink]="['/productos', prod.id]" class="btn-view">Ver Detalle</button> <button (click)="borrar(prod.id)" class="btn-del">Eliminar</button>
        </td>
    </tr>
    </tbody>
</table>
